<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temps de travail</title>
  <style>
    /* Les teintes du thème sombre de Klocka (src/design/jetons.json : fond, encre, ardoise, menthe). */
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121312; color: #f2f2f0; font: 15px/1.55 "Instrument Sans", system-ui, sans-serif; }
    main { max-width: 440px; padding: 32px; text-align: center; }
    .etiquette { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #9a9c99; }
    h1 { margin: 16px 0 0; font-size: 30px; font-weight: 400; letter-spacing: -.02em; }
    p { margin: 16px 0 0; color: #9a9c99; }
    a { display: none; margin-top: 28px; padding: 8px 16px; border-radius: 999px; background: #96c0b8; color: #121312; text-decoration: none; font-size: 13.5px; }
  </style>
</head>
<body>
  <main>
    <div class="etiquette" id="etiquette">Temps de travail</div>
    <h1 id="titre">Ce site attend la pause.</h1>
    <p id="phrase"></p>
    <a id="retour" href="#">Rouvrir la page</a>
  </main>
  <script type="module" src="bloque.js"></script>
</body>
</html>
