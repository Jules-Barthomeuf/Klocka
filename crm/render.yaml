# Twenty, le CRM de Klocka (27 oct. 2026), sur Render, à côté du service Klocka et sans toucher à sa mémoire.
# Région Francfort, comme le service Klocka (klocka-fra, srv-dbq19gou01pc739i1h20), depuis le déménagement du 11 nov. 2026
# (avant : Virginie, créés le 27 oct.). Recréés par l'API Render sur ce modèle :
#   twenty-server-fra srv-dbq1a3oae00c73d0v18g (https://twenty-server-fra.onrender.com), twenty-worker-fra srv-dbq1a5ajnfac73eptg9g,
#   twenty-db-fra dpg-dbq19bijnfac73epqjp0-a (basic_1gb), twenty-redis-fra red-dbq19cbbc2fs73ckrfrg (starter).
# ENCRYPTION_KEY : tirée à la main (TWENTY_ENCRYPTION_KEY du .env), la même sur le serveur et le worker. Déploiement
# automatique coupé : une montée de version change le tag ici et sur les deux services, puis se déploie à la main.
# Repris du docker-compose officiel (packages/twenty-docker) : un serveur, un worker (yarn worker:prod), Postgres 16,
# Redis en noeviction (le worker ne doit perdre aucune tâche en file). Version épinglée : le compose refuse latest.
# Fichiers joints : stockage local sur le disque du serveur pour démarrer ; passer en S3 (STORAGE_TYPE=S_3) avant
# d'y mettre beaucoup de pièces, le worker n'ayant pas accès à ce disque.

envVarGroups:
  - name: twenty-commun
    envVars:
      - key: SERVER_URL
        value: https://crm.klocka.immo
      # La même clé pour le serveur et le worker ; la perdre, c'est perdre les secrets chiffrés (la garder à part).
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_TYPE
        value: local

services:
  - type: web
    name: twenty-server
    runtime: image
    image:
      url: docker.io/twentycrm/twenty:v2.51.0
    region: frankfurt
    plan: 1c-2g
    healthCheckPath: /healthz
    disk:
      name: twenty-fichiers
      mountPath: /app/packages/twenty-server/.local-storage
      sizeGB: 10
    envVars:
      - fromGroup: twenty-commun
      - key: NODE_PORT
        value: "3000"
      - key: PORT
        value: "3000"
      - key: PG_DATABASE_URL
        fromDatabase:
          name: twenty-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: twenty-redis
          property: connectionString

  - type: worker
    name: twenty-worker
    runtime: image
    image:
      url: docker.io/twentycrm/twenty:v2.51.0
    region: frankfurt
    plan: 1c-2g
    dockerCommand: yarn worker:prod
    envVars:
      - fromGroup: twenty-commun
      # Les migrations et les tâches planifiées tournent déjà sur le serveur.
      - key: DISABLE_DB_MIGRATIONS
        value: "true"
      - key: DISABLE_CRON_JOBS_REGISTRATION
        value: "true"
      - key: PG_DATABASE_URL
        fromDatabase:
          name: twenty-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: twenty-redis
          property: connectionString

  - type: keyvalue
    name: twenty-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: twenty-db
    region: frankfurt
    plan: basic_1gb
    postgresMajorVersion: "16"
